name: Dedupe Similar Articles (AI-judged, one-time)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'auto = SEKALI JALAN (nilai semua lalu eksekusi) | judge/report/apply = mode bertahap (manual)'
        type: choice
        options: [auto, judge, report, apply]
        default: auto
      cleanup:
        description: '(auto/apply) Setelah SELESAI, hapus script dedupe dari repo (workflow ini dihapus manual)'
        type: boolean
        default: false
      limit:
        description: '(judge) Maks. jumlah penilaian AI per run'
        type: string
        default: '40'
      section:
        description: 'Folder di content/ yang diperiksa'
        type: string
        default: 'blog'
      max_delete:
        description: '(apply) Batalkan jika artikel yang akan dihapus lebih dari ini'
        type: string
        default: '40'
      max_cluster:
        description: 'Kelompok dengan lebih dari N artikel yang dihapus dilewati (tinjau manual)'
        type: string
        default: '8'
      retry_errors:
        description: '(judge) Ulangi penilaian yang sebelumnya gagal diparse'
        type: boolean
        default: false
      allow_partial:
        description: '(apply) Tetap eksekusi walau masih ada artikel yang belum dinilai AI'
        type: boolean
        default: false

# Serialize dengan workflow lain yang commit ke master.
concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # untuk memicu deploy.yml

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Tanpa npm install: script hanya memakai fs/path/https bawaan Node.
      - name: Run dedupe
        env:
          IN_PHASE: ${{ inputs.phase }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_SECTION: ${{ inputs.section }}
          IN_MAX_DELETE: ${{ inputs.max_delete }}
          IN_MAX_CLUSTER: ${{ inputs.max_cluster }}
          IN_RETRY: ${{ inputs.retry_errors }}
          IN_PARTIAL: ${{ inputs.allow_partial }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS="--section=$IN_SECTION --max-delete=$IN_MAX_DELETE --max-cluster=$IN_MAX_CLUSTER"
          case "$IN_PHASE" in
            auto)
              ARGS="$ARGS --auto" ;;
            judge)
              ARGS="$ARGS --judge --limit=$IN_LIMIT"
              if [ "$IN_RETRY" = "true" ]; then ARGS="$ARGS --retry-errors"; fi ;;
            apply)
              ARGS="$ARGS --apply"
              if [ "$IN_PARTIAL" = "true" ]; then ARGS="$ARGS --allow-partial"; fi ;;
          esac
          node tools/dedupe-articles.js $ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedupe-report
          path: dedupe-report.json
          if-no-files-found: ignore

      # Hanya jika diminta DAN semua artikel sudah dinilai (laporan: undecidedSeeds = 0).
      # File workflow ini sendiri tidak bisa dihapus oleh GITHUB_TOKEN — hapus manual lewat GitHub.
      - name: Cleanup (hapus script dedupe setelah selesai)
        if: ${{ inputs.cleanup && (inputs.phase == 'auto' || inputs.phase == 'apply') }}
        run: |
          COMPLETE=$(node -e "try{const r=require('./dedupe-report.json');console.log(r.undecidedSeeds===0?'yes':'no')}catch{console.log('no')}")
          if [ "$COMPLETE" = "yes" ]; then
            git rm -rq --ignore-unmatch tools/dedupe-articles.js tools/lib/dedupe-judge.js tools/prompts/dedupe-articles.json .dedupe-approve.txt .dedupe-protect.txt
            rm -f .dedupe-decisions.json dedupe-report.json
            echo "🧹 Script dedupe dihapus (tools/lib/keyword-similarity.js, static/redirects.js, .excluded-keywords.json SENGAJA dipertahankan)."
          else
            echo "ℹ️  Belum semua dinilai — cleanup dilewati. Jalankan workflow lagi."
          fi

      - name: Configure Git
        if: ${{ inputs.phase != 'report' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Worktree hanya berisi perubahan dari script (tanpa npm install), jadi git add -A aman.
      - name: Commit and Push
        id: commit_push
        if: ${{ inputs.phase != 'report' }}
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "ℹ️  Tidak ada perubahan."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --staged --name-only | grep -qE '^(content/|static/redirects\.js)'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          fi

          git commit -m "Dedupe (${{ inputs.phase }}): gabungkan artikel mirip + redirect"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push berhasil (percobaan $i)."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push gagal 5x — cek manual." >&2
              exit 1
            fi
            sleep $(( (RANDOM % 10) + 5 ))
            git fetch origin master
            git stash push -u -m "pre-rebase-autostash" || true
            git rebase origin/master
            git stash drop || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deploy
        if: ${{ steps.commit_push.outputs.published == 'true' && steps.commit_push.outputs.site_changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
