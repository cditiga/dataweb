name: Revise Duplicate Articles (AI)

on:
  schedule:
    - cron: '0 3 * * *'   # tiap hari jam 3 pagi — sesuaikan sesuai kebutuhan
  workflow_dispatch:        # bisa dipicu manual dari tab Actions

permissions:
  contents: write
  models: read

jobs:
  revise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install gray-matter

      - name: Revisi Artikel (bertahap, maks 20/hari)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node revise-articles.js --apply --limit=20

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Revisions
        run: |
          git add content/ .revise-progress.json revised-articles.log
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "Revisi: kurangi kemiripan konten lintas-kota"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
