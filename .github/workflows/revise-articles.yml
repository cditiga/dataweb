name: Revise Duplicate Articles (AI)

on:
  schedule:
    # 18:00 UTC = 01:00 WIB (early morning of the following day, "past midnight"). Deliberately
    # far from generate-articles.yml's 06:00 UTC (13:00 WIB siang) — a ~12h gap.
    - cron: '0 18 * * *'
  workflow_dispatch:

# Serialize with generate-articles.yml and recycle-and-deploy.yml — see comment there.
concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to explicitly trigger recycle-and-deploy.yml at the end of this run — see comment
  # on the "Trigger Recycle & Deploy" step below.
  actions: write

jobs:
  revise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Idempotent — see same step in generate-articles.yml for context. Included here too
      # since this workflow can run before generate-articles.yml on a given day.
      - name: Untrack node_modules (one-time, idempotent)
        run: |
          if [ -n "$(git ls-files node_modules/ | head -n1)" ]; then
            echo "📦 node_modules is tracked in git — untracking it now..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            grep -qxF 'node_modules/' .gitignore 2>/dev/null || echo "node_modules/" >> .gitignore
            git rm -r --cached node_modules >/dev/null
            git add .gitignore
            git commit -m "chore: untrack node_modules [skip ci]"
            git push origin master
            echo "✅ node_modules untracked and pushed."
          else
            echo "✅ node_modules already untracked — nothing to do."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install gray-matter

      - name: Analyze Duplicate Candidates (Layer 1 — fast, offline, results NOT committed)
        run: node tools/dedup-lapis1.js

      - name: Revise Articles (staged, max 20/day)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/revise-articles.js --apply --limit=20

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Revisions
        id: commit_push
        run: |
          git add content/ .revise-progress.json revised-articles.log

          if git diff --staged --quiet; then
            echo "ℹ️  Nothing to commit (0 articles revised this session) — done."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Revisi: kurangi kemiripan konten"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push succeeded (attempt $i)."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push still failed after 5 attempts — possible real conflict, check manually." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push rejected (possible race with another workflow), rebase & retry in ${wait_s}s... (attempt $i/5)"
            sleep "$wait_s"
            git fetch origin master
            # Stash any incidental working-tree noise (e.g. package-lock.json drift from
            # npm install) so it can't block the rebase below with "unstaged changes" errors.
            git stash push -u -m "pre-rebase-autostash" || true
            git rebase origin/master
            git stash drop || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes made with GITHUB_TOKEN above do NOT trigger recycle-and-deploy.yml's `push`
      # trigger — that's a GitHub anti-recursion safeguard (see docs.github.com/en/actions/
      # concepts/security/github_token), not a bug in our workflow. Without this step,
      # today's revised articles would just sit committed on `master` until
      # recycle-and-deploy.yml's own cron happens to fire (up to ~2 days later). This
      # explicitly dispatches it now, so today's revisions go live today.
      - name: Trigger Recycle & Deploy (publish today's revisions now)
        if: steps.commit_push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Revisions pushed — triggering recycle-and-deploy.yml so they go live now..."
          gh workflow run deploy.yml --ref master