name: Revise Duplicate Articles (AI)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install gray-matter

      - name: Analyze Duplicate Candidates (Layer 1 — fast, offline, results NOT committed)
        run: node dedup-lapis1.js

      - name: Revise Articles (staged, max 20/day)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node revise-articles.js --apply --limit=20

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Revisions
        run: |
          git add content/ .revise-progress.json revised-articles.log

          if git diff --staged --quiet; then
            echo "ℹ️  Nothing to commit (0 articles revised this session) — done."
            exit 0
          fi

          git commit -m "Automatic revision"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push succeeded (attempt $i)."
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push still failed after 5 attempts — possible real conflict, check manually." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push rejected (possible race with another workflow), rebase & retry in ${wait_s}d... (attempt $i/5)"
            sleep "$wait_s"
            git fetch origin master
            git rebase origin/master
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}