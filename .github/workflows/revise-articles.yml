name: Revise Duplicate Articles (AI)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  revise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install gray-matter

      - name: Analisa Kandidat Duplikat (Lapis 1 — cepat, offline, hasil TIDAK di-commit)
        run: node dedup-lapis1.js

      - name: Revisi Artikel (bertahap, maks 20/hari)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node revise-articles.js --apply --limit=20

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Revisions
        run: |
          git add content/ .revise-progress.json revised-articles.log
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "Revisi otomatis"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push berhasil (percobaan $i)."
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push tetap gagal setelah 5 percobaan — kemungkinan ada conflict nyata, cek manual." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push ditolak (kemungkinan race dengan workflow lain), rebase & coba lagi dalam ${wait_s}d... (percobaan $i/5)"
            sleep "$wait_s"
            git fetch origin master
            git rebase origin/master
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}