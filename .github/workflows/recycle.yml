name: Recycle Old Posts

on:
  schedule:
    # Weekly (Sunday 00:00 UTC = 07:00 WIB). Recycling only touches articles ≥12 months old —
    # the pool of newly-eligible articles per day/week is naturally tiny (a slow, gradual
    # threshold), so there's no real freshness benefit to checking more often than this, only
    # extra CI minutes and repo-checkout overhead (this repo's checkout alone can take
    # 30-90 minutes). If you'd rather check every 2 days instead, change the cron below to
    # '0 0 */2 * *' — either is fine, weekly just costs less for the same practical result.
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Serialize with deploy.yml — both can build/deploy to gh-pages, and this workflow also
# commits to master, so running in parallel risks a messy deploy or a push race.
concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

jobs:
  recycle:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup Disk Space
        run: |
          echo "Disk space sebelum cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          echo "Disk space sesudah cleanup:"
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      # Idempotent — lihat penjelasan lengkap di generate-articles.yml. Cukup dilakukan
      # sekali oleh workflow mana pun yang jalan duluan; workflow lain akan skip otomatis.
      - name: Untrack node_modules (sekali jalan, idempotent)
        run: |
          if [ -n "$(git ls-files node_modules/ | head -n1)" ]; then
            echo "📦 node_modules masih ter-track di git — untrack sekarang..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            grep -qxF 'node_modules/' .gitignore 2>/dev/null || echo "node_modules/" >> .gitignore
            git rm -r --cached node_modules >/dev/null
            git add .gitignore
            git commit -m "chore: untrack node_modules [skip ci]"
            git push origin master
            echo "✅ node_modules berhasil di-untrack dan di-push."
          else
            echo "✅ node_modules sudah tidak ter-track — tidak ada yang perlu dilakukan."
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.124.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Installations
        run: |
          node --version
          npm --version
          hugo version

      - name: Run Recycle and Build
        run: npm run build:recycle

      - name: Prepare GitHub Pages
        run: |
          mkdir -p public
          echo "creativedesigninterior.com" > public/CNAME

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit Changes
        run: |
          git add content/ data/

          if git diff --staged --quiet; then
            echo "ℹ️  Tidak ada artikel yang perlu di-recycle minggu ini — selesai."
            exit 0
          fi

          git commit -m "Recycle posts and rebuild [skip ci]"

      - name: Push Changes
        run: |
          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push berhasil (percobaan $i)."
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push tetap gagal setelah 5 percobaan — kemungkinan ada conflict nyata, cek manual." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push ditolak (kemungkinan race dengan workflow lain), rebase & coba lagi dalam ${wait_s}s... (percobaan $i/5)"
            sleep "$wait_s"
            git fetch origin master
            # Stash perubahan working-tree yang tidak relevan (mis. drift node_modules/
            # package-lock.json dari npm ci) supaya tidak menghalangi rebase di bawah.
            git stash push -u -m "pre-rebase-autostash" || true
            git rebase origin/master
            git stash drop || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup node_modules
        if: always()
        run: |
          rm -rf node_modules .npm
          npm cache clean --force
          echo "Disk space setelah cleanup node_modules:"
          df -h

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          full_commit_message: ${{ format('Recycle & deploy — {0}', github.run_id) }}

      - name: Verify Deployment
        run: |
          echo "Deployment selesai!"
          ls -l public
